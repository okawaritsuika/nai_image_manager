<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arca 로그인 연결</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Arca 로그인 연결</h1>
      <p>아카라이브에 로그인한 이 Chrome의 세션을 두 앱에 각각 연결합니다. 사용할 앱을 먼저 실행해 주세요.</p>
      <button id="connectSession" type="button">현재 로그인 연결</button>
      <p id="status" class="status" role="status" aria-live="polite">실행 중인 앱의 연결 상태를 확인합니다.</p>
      <section class="applications" aria-label="앱별 연결 결과">
        <div class="application"><h2>NAI Image Manager <small>5000</small></h2><p id="managerStatus" class="status" role="status" aria-live="polite">연결 상태 확인 중…</p></div>
        <div class="application"><h2>NAImakeArtistGroup <small>5001</small></h2><p id="artistStatus" class="status" role="status" aria-live="polite">연결 상태 확인 중…</p></div>
      </section>
      <p class="privacy">쿠키 값은 표시하거나 저장하지 않습니다.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
